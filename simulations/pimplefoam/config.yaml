# Unidades SI; vetores [X, Y, Z]; rotação no eixo Y.
geometry:    # Geometria e material.
  rotor_stl: propeller_test.stl    # STL da hélice em constant/triSurface/.
  rotation_centre: [0, 0, 0]       # m; centro de rotação [X, Y, Z].
  material_density: 1270.0         # kg/m³; densidade do material maciço.
  mass_correction_kg: 0.000733954584  # kg; três ímãs menos PETG do furo Ø5 × 6 mm.
  shaft_inertia_correction_kg_m2: 4.12849453e-8  # kg·m²; acréscimo líquido a 7,5 mm do eixo.
  cylinder_stl: cylinder.stl       # STL da região de malha rotativa.
  cylinder_mode: auto              # auto gera o cilindro; existing usa o STL.
  cylinder_radial_clearance: 0.07  # m; folga entre ponta da pá e cilindro.
  cylinder_axial_clearance: 0.17   # m; folga em cada extremidade do eixo Y.
  cylinder_segments: 128           # Divisões da circunferência do cilindro.

bench:       # Dimensões da bancada.
  fan_diameter: 0.40          # m; diâmetro da entrada circular de ar.
  fan_distance: 1.0           # m; distância da entrada ao centro do rotor.
  axis_height: 0.40           # m; altura do eixo acima do chão.
  fan_refinement: 2           # Nível de refinamento na entrada de ar.
  fan_refinement_depth: 0.20  # m; extensão do refinamento após a entrada.

initial:     # Estado inicial do fluido.
  velocity: [0, 0, 0]  # m/s; velocidade inicial [X, Y, Z].
  pressure: 0.0        # m²/s²; pressão cinemática inicial.

fluid:       # Propriedades do ar.
  density: 1.225  # kg/m³; densidade do ar.
  nu: 1.5e-5      # m²/s; viscosidade cinemática.

turbulence:  # Turbulência na entrada.
  model: kOmegaSST  # Modelo de turbulência usado pelo caso.
  k: 0.02           # m²/s²; energia cinética turbulenta.
  omega: 15.0       # 1/s; dissipação turbulenta específica.

wind:        # Velocidade prescrita na entrada.
  profile:              # Pares [tempo em s, velocidade em m/s].
    - [0.0, 7.09]
    - [9.0, 7.09]
  reference_speed: 7.09  # m/s; referência dos coeficientes nativos.

motion:      # Movimento do rotor e da malha.
  prescribed_rpm: null         # RPM com sinal no eixo Y; null: rotação livre.
  initial_rpm: 0.0               # RPM inicial no modo livre.
  ami_low_weight_correction: 0.1  # Soma mínima dos pesos de interpolação AMI.
  ami_min_cos_angle: 0.3          # Cosseno mínimo após inverter a normal do lado oposto.
  ami_max_normal_distance: 0.02   # m; distância normal máxima entre faces candidatas.
  inner_distance: null            # m; distância à hélice com malha rígida; null: auto.
  outer_distance: null            # m; fim do movimento; null: inner_distance + 0,10.
  gravity: [0, 0, 0]              # m/s²; gravidade [X, Y, Z].
  integration:                    # Integração temporal do movimento.
    type: Newmark  # Newmark ou CrankNicolson.
    gamma: 0.5     # Peso da velocidade; apenas Newmark.
    beta: 0.25     # Peso da posição; apenas Newmark.
    aoc: 0.5       # Peso da aceleração; apenas CrankNicolson.
    voc: 0.5       # Peso da velocidade; apenas CrankNicolson.
  acceleration_relaxation: 0.7    # Relaxação da aceleração entre correções.
  acceleration_damping: 1.0       # Amortecimento numérico; 1 não reduz aceleração.
  shaft_damping: 0.0              # N·m·s/rad; perda adicional do eixo, além do gerador.

generator:   # Referência aproximada; não é a ficha do RS-775SF instalado.
  enabled: true
  mechanical_loss_model: viscous_from_no_load  # none ou estimativa viscosa pelo catálogo.
  reference_model: RS-775VC-9013
  source_url: https://product-en-origin.mabuchi-motor.co.jp/detail.html?id=220
  nominal_voltage_V: 18.0       # V; tensão do ensaio de catálogo.
  no_load_speed_rpm: 21900.0    # RPM; rotação sem carga a 18 V.
  no_load_current_A: 2.74       # A; corrente sem carga do catálogo.
  stall_current_A: 147.0       # A; corrente de bloqueio do catálogo.
  load_resistance_ohm: 10.0     # Ω; resistor externo.
  shunt_resistance_ohm: 0.1     # Ω; shunt do INA219 em série.

time:        # Tempo e gravação dos campos.
  endTime: 9.0            # s; duração do ensaio no laboratório.
  deltaT: 0.0002           # s; passo de tempo inicial.
  maxDeltaT: 0.0002        # s; maior passo de tempo permitido.
  maxCo: 1.0               # Número de Courant máximo desejado.
  writeInterval: 0.1       # s; intervalo dos campos para ParaView.
  writePrecision: 10       # Algarismos dos campos em formato ASCII.
  adjustTimeStep: true     # Ajusta o passo pelo limite de Courant.
  writeFormat: binary      # Formato dos campos: binary ou ascii.
  writeCompression: false  # Comprime os arquivos de campos.
  timePrecision: 6         # Algarismos nos nomes das pastas de tempo.

output:      # Amostragem e análise.
  sample_steps: 1      # Passos entre registros de forças e momentos.
  yplus_interval: 0.2  # s; intervalo de gravação de y+.
  min_wind_speed: 0.1  # m/s; mínimo para calcular Cp, Cq e TSR.
  plots: true          # Gera gráficos após a simulação.

parallel:    # Execução com MPI.
  method: simple        # Divisão da malha: scotch, simple ou hierarchical.
  divisions: [2, 3, 1]  # Partições [X, Y, Z]; simple/hierarchical.
  order: xyz            # Ordem de divisão; apenas hierarchical.
  mpi_test_timeout: 15  # s; tempo máximo do teste de inicialização MPI.
  processes: 6          # Processos MPI; run_mpi.sh N tem prioridade.

mesh:        # Domínio e refinamento.
  bounds: [[-1.1, -1.0, -0.40], [1.1, 4.4, 1.1]]  # m; limites [mínimo XYZ, máximo XYZ].
  cells: [10, 28, 18]                         # Células-base em [X, Y, Z].
  y_grading: [[1.8, 18, 1], [3.6, 10, 5.5]]   # [Comprimento relativo, células, expansão em Y].
  location_in_mesh: [0, -0.7, 0]              # m; ponto no fluido externo a preservar.
  maxLocalCells: 1000000                      # Limite de células por processo no refinamento.
  maxGlobalCells: 5000000                     # Limite total de células no refinamento.
  rotor_level: 6                              # Nível na superfície e nas arestas da hélice.
  cylinder_level: 1                           # Refinamento no interior do cilindro.
  cylinder_surface_level: 2                   # Refinamento na superfície da AMI.
  distance_levels: [[0.001, 6], [0.003, 5], [0.008, 4]]  # Pares [distância à hélice em m, nível].
  add_layers: true                           # Ativa camadas de células junto à hélice.
  surface_layers: 2                           # Número de camadas; usado com add_layers: true.
  castellated_controls:                       # Refinamento antes do ajuste à superfície.
    minRefinementCells: 10            # Mínimo de células marcadas para continuar.
    nCellsBetweenLevels: 2            # Células de transição entre níveis.
    resolveFeatureAngle: 30           # Graus; ângulo para refinar arestas.
    allowFreeStandingZoneFaces: true  # Permite faces de zona fora das superfícies.
  snap_controls:                              # Ajuste da malha ao STL.
    nSmoothPatch: 5                # Suavizações da superfície antes do ajuste.
    tolerance: 0.7                 # Distância de atração relativa à aresta local.
    nSolveIter: 30                 # Iterações para suavizar deslocamentos.
    nRelaxIter: 5                  # Iterações de relaxação do ajuste.
    nFeatureSnapIter: 10           # Iterações de ajuste às arestas.
    implicitFeatureSnap: false     # Detecta arestas pela superfície.
    explicitFeatureSnap: true      # Usa as arestas extraídas no arquivo .eMesh.
    multiRegionFeatureSnap: false  # Reconhece arestas entre regiões.
  layer_controls:                             # Usado apenas com add_layers: true.
    relativeSizes: false             # Espessuras relativas ao tamanho da célula.
    expansionRatio: 1.25             # Crescimento da espessura entre camadas.
    finalLayerThickness: 0.0004    # m; espessura da camada externa.
    minThickness: 0.00005           # m; espessura mínima do conjunto.
    nGrow: 0                        # Faixas sem camadas ao redor de falhas.
    featureAngle: 80                # Graus; ângulo limite para adicionar camadas.
    nRelaxIter: 3                   # Iterações de relaxação da extrusão.
    nSmoothSurfaceNormals: 1        # Suavizações das normais na superfície.
    nSmoothNormals: 3               # Suavizações das normais no volume.
    nSmoothThickness: 10            # Suavizações da espessura das camadas.
    maxFaceThicknessRatio: 0.5      # Limite espessura/tamanho da face.
    maxThicknessToMedialRatio: 0.3  # Limite espessura/distância ao eixo medial.
    minMedialAxisAngle: 90          # Graus; ângulo para identificar o eixo medial.
    nBufferCellsNoExtrude: 1        # Células de transição no fim das camadas.
    nLayerIter: 36                  # Limite de iterações para gerar camadas.
  quality_controls:                           # Limites de qualidade da malha.
    maxNonOrtho: 65          # Graus; não ortogonalidade máxima.
    maxBoundarySkewness: 20  # Distorção máxima nas faces de contorno.
    maxInternalSkewness: 4   # Distorção máxima nas faces internas.
    maxConcave: 80           # Graus; concavidade máxima das faces.
    minVol: 1.0e-13          # m³; volume mínimo das pirâmides de face.
    minTetQuality: 1.0e-15   # Qualidade mínima dos tetraedros de verificação.
    minArea: -1              # m²; área mínima de face; -1 desativa.
    minTwist: 0.02           # Alinhamento mínimo face/triângulos.
    minDeterminant: 0.001    # Determinante normalizado mínimo da célula.
    minFaceWeight: 0.05      # Peso mínimo de interpolação nas faces.
    minVolRatio: 0.01        # Razão mínima de volumes entre vizinhos.
    minTriangleTwist: -1     # Alinhamento entre triângulos; -1 libera.
    nSmoothScale: 4          # Iterações para distribuir correções de erro.
    errorReduction: 0.75     # Fator de redução do deslocamento com erro.
  merge_tolerance: 1.0e-6                     # Tolerância relativa para unir pontos.
  feature_included_angle: 150                 # Graus; ângulo de extração de arestas do STL.

numerics:    # Acoplamento pressão-velocidade.
  nOuterCorrectors: 2          # Ciclos externos PIMPLE por passo.
  nCorrectors: 2               # Correções de pressão por ciclo.
  nNonOrthogonalCorrectors: 1  # Correções extras de não ortogonalidade.
  momentumPredictor: true      # Resolve a velocidade antes da pressão.
  solvers:                     # Sistemas lineares de cada campo.
    p:      # Pressão cinemática.
      solver: GAMG           # Algoritmo de solução do sistema linear.
      smoother: GaussSeidel  # Método de suavização dos resíduos.
      tolerance: 1.0e-06     # Resíduo absoluto para encerrar o solver.
      relTol: 0.1            # Resíduo relativo para encerrar o solver.
      final_relTol: 0        # relTol final; 0 exige o critério absoluto.
    pcorr:  # Pressão auxiliar para corrigir o fluxo.
      solver: GAMG           # Algoritmo de solução do sistema linear.
      smoother: GaussSeidel  # Método de suavização dos resíduos.
      tolerance: 1.0e-06     # Resíduo absoluto para encerrar o solver.
      relTol: 0              # Resíduo relativo para encerrar o solver.
      final_relTol: 0        # relTol final; 0 exige o critério absoluto.
    U:      # Velocidade do ar.
      solver: smoothSolver      # Algoritmo de solução do sistema linear.
      smoother: symGaussSeidel  # Método de suavização dos resíduos.
      tolerance: 1.0e-06        # Resíduo absoluto para encerrar o solver.
      relTol: 0.1               # Resíduo relativo para encerrar o solver.
      final_relTol: 0           # relTol final; 0 exige o critério absoluto.
    k:      # Energia cinética turbulenta.
      solver: smoothSolver      # Algoritmo de solução do sistema linear.
      smoother: symGaussSeidel  # Método de suavização dos resíduos.
      tolerance: 1.0e-06        # Resíduo absoluto para encerrar o solver.
      relTol: 0.1               # Resíduo relativo para encerrar o solver.
      final_relTol: 0           # relTol final; 0 exige o critério absoluto.
    omega:  # Dissipação turbulenta específica.
      solver: smoothSolver      # Algoritmo de solução do sistema linear.
      smoother: symGaussSeidel  # Método de suavização dos resíduos.
      tolerance: 1.0e-06        # Resíduo absoluto para encerrar o solver.
      relTol: 0.1               # Resíduo relativo para encerrar o solver.
      final_relTol: 0           # relTol final; 0 exige o critério absoluto.
  relaxation:                  # Fatores de relaxação numérica.
    p: 0.2      # Relaxação do campo de pressão.
    U: 0.5      # Relaxação da equação de velocidade.
    k: 0.5      # Relaxação da equação de k.
    omega: 0.5  # Relaxação da equação de omega.

schemes:     # Discretização das equações.
  time: Euler                                 # Derivada temporal do fluido.
  gradient: Gauss linear                      # Gradientes dos campos.
  velocity_gradient: cellLimited Gauss linear 1  # Gradiente de velocidade com limitador.
  velocity_divergence: bounded Gauss linearUpwind grad(U)  # Transporte convectivo da velocidade.
  k_divergence: bounded Gauss upwind            # Transporte convectivo de k.
  omega_divergence: bounded Gauss upwind        # Transporte convectivo de omega.
  viscous_divergence: Gauss linear            # Termo de tensões viscosas.
  laplacian: Gauss linear corrected           # Termos difusivos e correção geométrica.
  interpolation: linear                       # Interpolação dos centros para as faces.
  normal_gradient: corrected                  # Gradiente normal às faces.
  wall_distance: meshWave                     # Método de cálculo da distância à parede.
